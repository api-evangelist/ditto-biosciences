name: Ditto Biosciences
description: >-
  Ditto Biosciences (Ditto Bio) is a San Francisco biotechnology startup, founded in 2025 and
  backed by Y Combinator (Winter 2026 batch), that discovers drugs for autoimmune diseases by
  identifying and engineering immune-controlling proteins that parasites, viruses, ticks, and
  worms have naturally evolved over millions of years to modulate the human immune system. The
  company pairs an AI platform with wet-lab biology to mine more than a million natural proteins,
  identify candidates predicted to hit clinically validated human immune-disease targets, and
  transform them into therapeutic candidates. Ditto is an early-stage, three-person team led by
  founders Dennis Sun (CEO), Adair Borges (CSO), and Emily Weiss (CTO). This is a company profile
  in the API Evangelist network; Ditto Bio currently publishes a marketing and science website
  only and exposes no public API, developer portal, SDK, or machine-readable developer surface.
